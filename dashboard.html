<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Booking MUA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #D4537E;
      --pink-light: rgba(212, 83, 126, 0.08);
      --pink-focus: rgba(212, 83, 126, 0.15);
      --green: #3b6d11;
      --green-light: rgba(59, 109, 17, 0.08);
      --yellow: #d4871c;
      --yellow-light: rgba(212, 135, 28, 0.08);
      --red: #a32d2d;
      --red-light: rgba(163, 45, 45, 0.08);
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --border: #e0e0e0;
      --bg: #fff;
      --bg-soft: #fafaf9;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-soft);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .dashboard-wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }

    /* Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .dashboard-header h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    .header-controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    /* Search & Filter */
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      flex: 1;
      min-width: 200px;
    }

    .search-box input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
    }

    .search-box i { color: var(--text-secondary); font-size: 16px; }

    .filter-select {
      padding: 8px 12px;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s;
    }

    .filter-select:hover { border-color: var(--pink); }
    .filter-select:focus { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-focus); }

    .btn-refresh {
      padding: 8px 14px;
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-refresh:hover { background: #bf4570; }
    .btn-refresh:disabled { opacity: 0.65; cursor: not-allowed; }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* Bookings List */
    .bookings-container {
      display: grid;
      gap: 1rem;
    }

    .booking-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: start;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .booking-card:hover {
      border-color: var(--pink);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .booking-info {
      display: grid;
      gap: 1rem;
    }

    .booking-header {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
    }

    .booking-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .booking-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      width: fit-content;
    }

    .status-pending {
      background: var(--yellow-light);
      color: var(--yellow);
      border: 0.5px solid rgba(212, 135, 28, 0.3);
    }

    .status-confirmed {
      background: var(--green-light);
      color: var(--green);
      border: 0.5px solid rgba(59, 109, 17, 0.3);
    }

    .status-completed {
      background: #f0f0f0;
      color: #888;
      border: 0.5px solid var(--border);
    }

    .booking-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      font-size: 13px;
    }

    .booking-meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .booking-meta-item i {
      color: var(--pink);
      font-size: 16px;
      flex-shrink: 0;
    }

    .booking-meta-label {
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .booking-meta-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .booking-price {
      text-align: right;
      min-width: 120px;
    }

    .price-subtotal {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .price-dp {
      font-size: 13px;
      font-weight: 600;
      color: var(--pink);
      margin-bottom: 8px;
    }

    .price-sisa {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      padding-top: 8px;
      border-top: 0.5px solid var(--border);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 48px;
      display: block;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    .empty-state p {
      font-size: 14px;
      margin: 0;
    }

    /* Loading */
    .loading-spinner {
      display: flex;
      justify-content: center;
      padding: 3rem;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(0,0,0,0.1);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg);
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 0.5px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .modal-close:hover { color: var(--text-primary); }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-section {
      margin-bottom: 1.5rem;
    }

    .modal-section:last-child { margin-bottom: 0; }

    .modal-section-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 0.5px solid var(--border);
    }

    .modal-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 14px;
      margin-bottom: 0.75rem;
    }

    .modal-row:last-child { margin-bottom: 0; }

    .modal-label {
      color: var(--text-secondary);
      font-weight: 500;
      flex: 0 0 35%;
    }

    .modal-value {
      color: var(--text-primary);
      font-weight: 500;
      flex: 1;
      text-align: right;
      word-break: break-word;
    }

    .paket-item {
      background: var(--pink-light);
      border: 0.5px solid rgba(212,83,126,0.2);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 0.5rem;
      font-size: 13px;
      color: var(--text-primary);
    }

    .paket-item:last-child { margin-bottom: 0; }

    /* Responsive */
    @media (max-width: 768px) {
      .dashboard-wrap { padding: 1.5rem 1rem; }
      .dashboard-header { flex-direction: column; align-items: flex-start; }
      .header-controls { width: 100%; }
      .search-box { min-width: auto; flex: 1; }
      .booking-card { grid-template-columns: 1fr; gap: 1rem; }
      .booking-header { flex-direction: column; align-items: flex-start; }
      .booking-price { text-align: left; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .dashboard-header h1 { font-size: 22px; }
      .booking-meta { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="dashboard-wrap">

  <!-- Header -->
  <div class="dashboard-header">
    <h1>📋 Dashboard Booking MUA</h1>
    <div class="header-controls">
      <div class="search-box">
        <i class="ti ti-search"></i>
        <input type="text" id="searchInput" placeholder="Cari nama atau nomor WA..." />
      </div>
      <select id="filterStatus" class="filter-select">
        <option value="">Semua Status</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="completed">Completed</option>
      </select>
      <button id="refreshBtn" class="btn-refresh">
        <i class="ti ti-refresh"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Total Booking</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statPending">0</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statConfirmed">0</div>
      <div class="stat-label">Confirmed</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statRevenue">Rp 0</div>
      <div class="stat-label">Total Revenue</div>
    </div>
  </div>

  <!-- Bookings List -->
  <div class="bookings-container" id="bookingsContainer">
    <div class="loading-spinner">
      <div class="spinner"></div>
    </div>
  </div>

</div>

<!-- Modal Detail -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Detail Booking</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2uaK6Q32aADVZrn25WX6rtAzpQfY1tQR8HUadcIcStFY4KQd9b6HP7g7Zg3ssVisVUw/exec";
  
  let allBookings = [];
  let filteredBookings = [];

  /* Format Rupiah */
  function fmtRp(str) {
    if (!str) return 'Rp 0';
    const num = parseInt(str.replace(/[^0-9]/g, ''), 10) || 0;
    return 'Rp ' + num.toLocaleString('id-ID');
  }

  /* Parse Date */
  function parseDate(dateStr) {
    return new Date(dateStr + 'T00:00:00');
  }

  /* Format Date */
  function fmtDate(dateStr) {
    if (!dateStr) return '-';
    const date = parseDate(dateStr);
    return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  /* Load Data */
  async function loadBookings() {
    document.getElementById('bookingsContainer').innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
    
    try {
      const response = await fetch(APPS_SCRIPT_URL + '?action=getData');
      const data = await response.json();
      
      if (data.success) {
        allBookings = data.bookings || [];
        filteredBookings = [...allBookings];
        renderBookings();
        updateStats();
      } else {
        showError('Gagal memuat data');
      }
    } catch (error) {
      console.error('Error:', error);
      showError('Gagal terhubung ke server');
    }
  }

  /* Render Bookings */
  function renderBookings() {
    const container = document.getElementById('bookingsContainer');
    
    if (filteredBookings.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <i class="ti ti-inbox"></i>
          <p>Tidak ada booking ditemukan</p>
        </div>
      `;
      return;
    }

    container.innerHTML = filteredBookings.map(booking => `
      <div class="booking-card" onclick="showDetail('${booking.id}')">
        <div class="booking-info">
          <div class="booking-header">
            <div class="booking-name">${booking.nama}</div>
            <span class="booking-status status-${booking.status || 'pending'}">
              ${booking.status === 'completed' ? 'Selesai' : booking.status === 'confirmed' ? 'Terkonfirmasi' : 'Pending'}
            </span>
          </div>
          <div class="booking-meta">
            <div class="booking-meta-item">
              <i class="ti ti-calendar"></i>
              <div>
                <div class="booking-meta-label">Tanggal</div>
                <div class="booking-meta-value">${fmtDate(booking.tanggal)}</div>
              </div>
            </div>
            <div class="booking-meta-item">
              <i class="ti ti-phone"></i>
              <div>
                <div class="booking-meta-label">WhatsApp</div>
                <div class="booking-meta-value">${booking.wa}</div>
              </div>
            </div>
            <div class="booking-meta-item">
              <i class="ti ti-map-pin"></i>
              <div>
                <div class="booking-meta-label">Lokasi</div>
                <div class="booking-meta-value">${booking.lokasi?.substring(0, 20) || '-'}...</div>
              </div>
            </div>
            <div class="booking-meta-item">
              <i class="ti ti-users"></i>
              <div>
                <div class="booking-meta-label">Jumlah Orang</div>
                <div class="booking-meta-value">${booking.jumlah_orang || 1} orang</div>
              </div>
            </div>
          </div>
        </div>
        <div class="booking-price">
          <div class="price-subtotal">Subtotal</div>
          <div class="price-dp">${fmtRp(booking.subtotal)}</div>
          <div class="price-sisa">${fmtRp(booking.sisa_bayar)}</div>
        </div>
      </div>
    `).join('');
  }

  /* Show Detail Modal */
  function showDetail(bookingId) {
    const booking = allBookings.find(b => b.id === bookingId);
    if (!booking) return;

    const modalBody = document.getElementById('modalBody');
    
    modalBody.innerHTML = `
      <!-- Client Info -->
      <div class="modal-section">
        <div class="modal-section-title">Informasi Klien</div>
        <div class="modal-row">
          <div class="modal-label">Nama</div>
          <div class="modal-value">${booking.nama}</div>
        </div>
        <div class="modal-row">
          <div class="modal-label">Email</div>
          <div class="modal-value">${booking.email}</div>
        </div>
        <div class="modal-row">
          <div class="modal-label">WhatsApp</div>
          <div class="modal-value">${booking.wa}</div>
        </div>
        <div class="modal-row">
          <div class="modal-label">Lokasi</div>
          <div class="modal-value">${booking.lokasi}</div>
        </div>
      </div>

      <!-- Schedule -->
      <div class="modal-section">
        <div class="modal-section-title">Detail Jadwal</div>
        <div class="modal-row">
          <div class="modal-label">Tanggal</div>
          <div class="modal-value">${fmtDate(booking.tanggal)}</div>
        </div>
        <div class="modal-row">
          <div class="modal-label">Jam Selesai Target</div>
          <div class="modal-value">${booking.jam_selesai || '-'}</div>
        </div>
      </div>

      <!-- Paket & Layanan -->
      <div class="modal-section">
        <div class="modal-section-title">Paket & Layanan</div>
        <div class="modal-row" style="flex-direction: column; align-items: flex-start;">
          <div class="modal-label" style="margin-bottom: 0.5rem;">Paket Make Up</div>
          ${booking.paket ? booking.paket.split(' | ').map(p => `<div class="paket-item">${p}</div>`).join('') : '<div class="paket-item">-</div>'}
        </div>
        ${booking.addon && booking.addon !== 'Tidak ada' ? `
          <div class="modal-row" style="flex-direction: column; align-items: flex-start; margin-top: 1rem;">
            <div class="modal-label" style="margin-bottom: 0.5rem;">Add On</div>
            ${booking.addon.split(', ').map(a => `<div class="paket-item">${a}</div>`).join('')}
          </div>
        ` : ''}
      </div>

      <!-- Pembayaran -->
      <div class="modal-section">
        <div class="modal-section-title">Pembayaran</div>
        <div class="modal-row">
          <div class="modal-label">Subtotal</div>
          <div class="modal-value">${fmtRp(booking.subtotal)}</div>
        </div>
        ${booking.transport_biaya && booking.transport_biaya !== '-' ? `
          <div class="modal-row">
            <div class="modal-label">Transport</div>
            <div class="modal-value">${fmtRp(booking.transport_biaya)}</div>
          </div>
        ` : ''}
        <div class="modal-row">
          <div class="modal-label">DP</div>
          <div class="modal-value">${fmtRp(booking.dp)}</div>
        </div>
        <div class="modal-row" style="border-top: 0.5px solid var(--border); padding-top: 0.75rem; margin-top: 0.75rem;">
          <div class="modal-label" style="font-weight: 600;">Sisa Pembayaran</div>
          <div class="modal-value" style="font-weight: 600; color: var(--pink);">${fmtRp(booking.sisa_bayar)}</div>
        </div>
      </div>

      <!-- Status -->
      <div class="modal-section">
        <div class="modal-section-title">Status</div>
        <div class="modal-row">
          <div class="modal-label">Status Booking</div>
          <div class="modal-value">
            <span class="booking-status status-${booking.status || 'pending'}">
              ${booking.status === 'completed' ? 'Selesai' : booking.status === 'confirmed' ? 'Terkonfirmasi' : 'Pending'}
            </span>
          </div>
        </div>
      </div>
    `;

    document.getElementById('detailModal').classList.add('active');
  }

  /* Close Modal */
  function closeModal() {
    document.getElementById('detailModal').classList.remove('active');
  }

  /* Update Stats */
  function updateStats() {
    const stats = {
      total: allBookings.length,
      pending: allBookings.filter(b => !b.status || b.status === 'pending').length,
      confirmed: allBookings.filter(b => b.status === 'confirmed').length,
      revenue: allBookings.reduce((sum, b) => {
        const sisa = parseInt(b.sisa_bayar?.replace(/[^0-9]/g, '') || 0, 10);
        return sum + sisa;
      }, 0)
    };

    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statPending').textContent = stats.pending;
    document.getElementById('statConfirmed').textContent = stats.confirmed;
    document.getElementById('statRevenue').textContent = 'Rp ' + stats.revenue.toLocaleString('id-ID');
  }

  /* Filter & Search */
  function applyFilters() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const statusFilter = document.getElementById('filterStatus').value;

    filteredBookings = allBookings.filter(booking => {
      const matchSearch = booking.nama.toLowerCase().includes(searchTerm) ||
                         booking.wa.includes(searchTerm);
      const matchStatus = !statusFilter || (booking.status || 'pending') === statusFilter;
      return matchSearch && matchStatus;
    });

    renderBookings();
  }

  /* Show Error */
  function showError(msg) {
    document.getElementById('bookingsContainer').innerHTML = `
      <div class="empty-state">
        <i class="ti ti-alert-circle"></i>
        <p>${msg}</p>
      </div>
    `;
  }

  /* Event Listeners */
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('filterStatus').addEventListener('change', applyFilters);
  document.getElementById('refreshBtn').addEventListener('click', loadBookings);
  document.getElementById('detailModal').addEventListener('click', (e) => {
    if (e.target.id === 'detailModal') closeModal();
  });

  /* Init */
  window.addEventListener('DOMContentLoaded', loadBookings);
</script>

</body>
</html>

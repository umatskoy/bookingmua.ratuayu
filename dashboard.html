<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Booking MUA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #D4537E;
      --pink-light: rgba(212, 83, 126, 0.08);
      --pink-focus: rgba(212, 83, 126, 0.15);
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --border: #e0e0e0;
      --bg: #fff;
      --bg-soft: #fafaf9;
      --success-bg: rgba(59,109,17,0.07);
      --success-border: rgba(59,109,17,0.25);
      --success-text: #2d5a0a;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-soft);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .dashboard-header {
      background: var(--bg);
      border-bottom: 0.5px solid var(--border);
      padding: 1.5rem 2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-primary);
    }

    .header-title span {
      display: inline-block;
      background: var(--pink);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .filter-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .filter-group select {
      padding: 8px 12px;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text-primary);
      cursor: pointer;
      outline: none;
    }

    .filter-group select:hover { border-color: var(--pink); }
    .filter-group select:focus { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink-focus); }

    .btn-refresh {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 0.5px solid var(--pink);
      background: var(--pink);
      color: #fff;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-refresh:hover { background: #bf4570; }
    .btn-refresh:active { transform: scale(0.98); }
    .btn-refresh.loading { opacity: 0.7; cursor: not-allowed; }
    .btn-refresh .spinner { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-pending {
      background: rgba(255,193,7,0.1);
      color: #f57f17;
      border: 0.5px solid rgba(255,193,7,0.3);
    }

    .status-confirmed {
      background: var(--success-bg);
      color: var(--success-text);
      border: 0.5px solid var(--success-border);
    }

    /* ── MAIN CONTENT ── */
    .dashboard-main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .stat-card-content h3 {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .stat-card-value {
      font-size: 28px;
      font-weight: 600;
      color: var(--pink);
    }

    .stat-card-icon {
      font-size: 28px;
      color: var(--pink);
      opacity: 0.3;
    }

    /* ── TABLE ── */
    .bookings-section {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .bookings-header {
      padding: 1.5rem;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bookings-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .bookings-count {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--pink-light);
      padding: 4px 12px;
      border-radius: 6px;
    }

    .bookings-table {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      background: var(--bg-soft);
      border-bottom: 0.5px solid var(--border);
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--border);
      color: var(--text-primary);
    }

    tbody tr:hover {
      background: var(--pink-light);
      cursor: pointer;
    }

    .name-col { font-weight: 500; }
    .date-col { color: var(--text-secondary); }
    .price-col { font-weight: 600; color: var(--pink); }
    .paket-col { font-size: 12px; color: var(--text-secondary); }

    .btn-detail {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      background: transparent;
      border: 0.5px solid var(--border);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: var(--pink);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-detail:hover {
      background: var(--pink-light);
      border-color: var(--pink);
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      animation: fadeIn 0.2s;
    }

    .modal-overlay.show { display: flex; align-items: center; justify-content: center; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-content {
      background: var(--bg);
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.3s;
    }

    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-header {
      padding: 1.5rem;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .btn-close {
      background: transparent;
      border: none;
      font-size: 20px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .btn-close:hover { color: var(--text-primary); }

    .modal-body {
      padding: 1.5rem;
    }

    .detail-section {
      margin-bottom: 1.5rem;
    }

    .detail-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--pink);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 0.5px solid var(--border);
    }

    .detail-row:last-child { border-bottom: none; }

    .detail-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .detail-value {
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 500;
      text-align: right;
      max-width: 55%;
      word-break: break-word;
    }

    .detail-value.highlight { color: var(--pink); font-weight: 600; }

    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-secondary);
    }

    .empty-state i { font-size: 48px; color: var(--border); margin-bottom: 1rem; display: block; opacity: 0.5; }

    .loading-spinner {
      display: none;
      text-align: center;
      padding: 3rem 2rem;
    }

    .loading-spinner i { font-size: 36px; color: var(--pink); animation: spin 1s linear infinite; }

    @media (max-width: 768px) {
      .header-content { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .header-controls { width: 100%; flex-direction: column; }
      .filter-group { width: 100%; }
      .filter-group select { width: 100%; }
      .btn-refresh { width: 100%; justify-content: center; }
      .stats-grid { grid-template-columns: 1fr; }
      th, td { padding: 10px 12px; font-size: 12px; }
      .btn-detail { padding: 5px 8px; font-size: 10px; }
      table { font-size: 12px; }
    }

    /* ── REVENUE SPLIT CARDS ── */
    .stats-grid-revenue {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }
    .revenue-sub {
      background: var(--bg-soft);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .revenue-sub-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .revenue-sub-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--pink);
    }
    .revenue-sub.lunas .revenue-sub-value { color: #2d5a0a; }

    /* ── STATUS CHANGE & EDIT BUTTONS ── */
    .btn-status {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: 4px; font-size: 11px;
      font-weight: 600; cursor: pointer; border: none;
      font-family: 'DM Sans', sans-serif; transition: all 0.2s;
    }
    .btn-status.to-confirmed { background: rgba(59,109,17,0.1); color: #2d5a0a; border: 0.5px solid rgba(59,109,17,0.3); }
    .btn-status.to-confirmed:hover { background: rgba(59,109,17,0.2); }
    .btn-status.to-pending { background: rgba(255,193,7,0.1); color: #f57f17; border: 0.5px solid rgba(255,193,7,0.3); }
    .btn-status.to-pending:hover { background: rgba(255,193,7,0.2); }
    .btn-status.lunas { background: rgba(59,109,17,0.1); color: #2d5a0a; border: 0.5px solid rgba(59,109,17,0.3); }
    .btn-status.lunas:hover { background: rgba(59,109,17,0.2); }
    .btn-status.belum-lunas { background: rgba(212,83,126,0.08); color: var(--pink); border: 0.5px solid rgba(212,83,126,0.3); }
    .btn-status.belum-lunas:hover { background: rgba(212,83,126,0.15); }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 0.5px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 8px;
    }

    /* ── EDIT MODAL ── */
    .edit-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 2000;
      align-items: center; justify-content: center;
    }
    .edit-overlay.show { display: flex; }
    .edit-modal {
      background: var(--bg); border-radius: 12px;
      max-width: 520px; width: 92%; max-height: 90vh;
      overflow-y: auto; animation: slideUp 0.25s;
    }
    .edit-modal .modal-header { padding: 1.25rem 1.5rem; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .edit-modal .modal-header h3 { font-size: 17px; font-weight: 600; }
    .edit-form { padding: 1.5rem; display: flex; flex-direction: column; gap: 14px; }
    .edit-field { display: flex; flex-direction: column; gap: 5px; }
    .edit-field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); }
    .edit-field input, .edit-field select {
      padding: 9px 12px; border: 0.5px solid var(--border); border-radius: 6px;
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      color: var(--text-primary); background: var(--bg); outline: none;
    }
    .edit-field input:focus, .edit-field select:focus { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink-focus); }
    .edit-form-footer { padding: 1rem 1.5rem; border-top: 0.5px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
    .btn-save {
      padding: 9px 20px; background: var(--pink); color: #fff;
      border: none; border-radius: 6px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-save:hover { background: #bf4570; }
    .btn-cancel-edit {
      padding: 9px 16px; background: transparent; color: var(--text-secondary);
      border: 0.5px solid var(--border); border-radius: 6px;
      font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer;
    }
    .btn-cancel-edit:hover { border-color: var(--text-secondary); }
    .save-status { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .save-status.ok { color: #2d5a0a; }
    .save-status.err { color: var(--pink); }

    /* ── PELUNASAN BADGE ── */
    .lunas-badge {
      display: inline-block; padding: 3px 8px; border-radius: 4px;
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .lunas-badge.lunas { background: rgba(59,109,17,0.1); color: #2d5a0a; border: 0.5px solid rgba(59,109,17,0.3); }
    .lunas-badge.belum { background: rgba(212,83,126,0.08); color: var(--pink); border: 0.5px solid rgba(212,83,126,0.25); }
  </style>
</head>
<body>

<div class="dashboard-header">
  <div class="header-content">
    <div class="header-title">
      <h1>Dashboard Booking</h1>
      <span>MUA</span>
    </div>
    <div class="header-controls">
      <div class="filter-group">
        <label for="filterMonth">Bulan:</label>
        <select id="filterMonth" onchange="filterBookings()">
          <option value="">Semua Bulan</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filterStatus">Status:</label>
        <select id="filterStatus" onchange="filterBookings()">
          <option value="">Semua Status</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
        </select>
      </div>
      <button class="btn-refresh" id="refreshBtn" onclick="loadBookings()">
        <i class="ti ti-refresh" style="font-size:14px;"></i>
        <span>Refresh</span>
      </button>
    </div>
  </div>
</div>

<div class="dashboard-main">

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-card-content">
        <h3>Total Booking</h3>
        <div class="stat-card-value" id="totalBookings">0</div>
      </div>
      <i class="ti ti-calendar stat-card-icon"></i>
    </div>
    <div class="stat-card" style="flex-direction:column; align-items:flex-start; gap:10px;">
      <div style="display:flex; justify-content:space-between; width:100%; align-items:flex-start;">
        <div class="stat-card-content">
          <h3>Total Revenue</h3>
          <div class="stat-card-value" id="totalRevenue" style="font-size:16px;">Rp 0</div>
        </div>
        <i class="ti ti-cash stat-card-icon"></i>
      </div>
      <div class="stats-grid-revenue">
        <div class="revenue-sub">
          <div class="revenue-sub-label">DP Masuk</div>
          <div class="revenue-sub-value" id="totalDpMasuk">Rp 0</div>
        </div>
        <div class="revenue-sub lunas">
          <div class="revenue-sub-label">Pelunasan</div>
          <div class="revenue-sub-value" id="totalPelunasan">Rp 0</div>
        </div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-card-content">
        <h3>Total Orang</h3>
        <div class="stat-card-value" id="totalOrang">0</div>
      </div>
      <i class="ti ti-users stat-card-icon"></i>
    </div>
    <div class="stat-card">
      <div class="stat-card-content">
        <h3>Sisa Pelunasan</h3>
        <div class="stat-card-value" id="pendingDP" style="font-size:16px;">Rp 0</div>
      </div>
      <i class="ti ti-alert-circle stat-card-icon"></i>
    </div>
  </div>

  <div class="bookings-section">
    <div class="bookings-header">
      <h2>Daftar Booking</h2>
      <span class="bookings-count" id="bookingsCount">0 booking</span>
    </div>
    <div class="loading-spinner" id="loadingSpinner">
      <i class="ti ti-loader-2"></i>
    </div>
    <div class="bookings-table" id="bookingsContainer">
      <div class="empty-state">
        <i class="ti ti-inbox"></i>
        <p>Belum ada data booking</p>
      </div>
    </div>
  </div>

</div>

<!-- Modal Detail -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>Detail Booking</h3>
      <button class="btn-close" onclick="closeModal()">
        <i class="ti ti-x"></i>
      </button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- Dynamic content -->
    </div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzW4Rs9Uc7psMTYJgKSRXnE_lWb8rKtJ1IxV4z_-D9R5tiZ4OoAYDAsIRxyd1hOc7NSAQ/exec";

  let allBookings = [];
  let filteredBookings = [];

  /* ── Format Helpers ── */
  function fmtRp(n) {
    if (n === 0 || !n) return 'Rp 0';
    return 'Rp ' + parseInt(n).toLocaleString('id-ID');
  }

  function parseRp(str) {
    if (str === null || str === undefined || str === '') return 0;
    if (typeof str === 'number') return Math.round(str);
    const cleaned = String(str).replace(/[^0-9]/g, '');
    return parseInt(cleaned, 10) || 0;
  }

  function parseDate(val) {
    if (val === null || val === undefined || val === '') return null;
    if (typeof val === 'number') {
      const ms = (val - 25569) * 86400 * 1000;
      const d = new Date(ms);
      return isNaN(d) ? null : d;
    }
    const s = String(val).trim();
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + 'T00:00:00');
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) {
      const parts = s.split('/');
      return new Date(parts[2] + '-' + parts[1] + '-' + parts[0] + 'T00:00:00');
    }
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }

  function fmtDate(dateStr) {
    const date = parseDate(dateStr);
    if (!date) return '-';
    return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function fmtDateTime(dateStr) {
    const date = parseDate(dateStr);
    if (!date) return '-';
    return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  function fmtTime(val) {
    if (val === null || val === undefined || val === '') return '-';
    // Angka serial Sheets: fraksi hari (misal 0.583333 = 14:00)
    if (typeof val === 'number') {
      // Jika angka besar (>= 1), mungkin serial date+time — ambil bagian fraksinya
      const frac = val % 1;
      const totalMinutes = Math.round(frac * 24 * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      // Konversi ke WIB (GMT+7) — Sheets menyimpan waktu di UTC
      const wibH = (h + 7) % 24;
      return String(wibH).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }
    const s = String(val).trim();
    // Sudah format HH:MM atau HH:MM:SS — langsung tampilkan
    if (/^\d{1,2}:\d{2}/.test(s)) return s.slice(0, 5);
    // ISO string dengan T (misal dari Date.toISOString)
    if (s.includes('T')) {
      const timePart = s.split('T')[1] || '';
      if (timePart) {
        const [hh, mm] = timePart.split(':');
        const wibH = (parseInt(hh, 10) + 7) % 24;
        return String(wibH).padStart(2, '0') + ':' + mm.slice(0, 2);
      }
    }
    return s;
  }

  /* ── Normalize Booking Fields ── */
  // Memetakan semua kemungkinan nama kolom dari Google Sheets ke key standar yang dipakai di JS
  function normalizeBooking(raw) {
    // Buat lookup case-insensitive dari semua key yang ada
    const lookup = {};
    Object.keys(raw).forEach(k => {
      lookup[k.toLowerCase().replace(/\s+/g, '_')] = raw[k];
      // juga simpan key aslinya
      lookup[k.toLowerCase()] = raw[k];
    });

    const pick = (...candidates) => {
      for (const c of candidates) {
        const v = lookup[c.toLowerCase().replace(/\s+/g, '_')] ?? lookup[c.toLowerCase()];
        if (v !== undefined && v !== null && v !== '') return v;
      }
      return '';
    };

    return {
      timestamp:       pick('timestamp'),
      nama:            pick('nama', 'name', 'Nama'),
      wa:              pick('wa', 'whatsapp', 'no_wa', 'nomor_wa', 'phone', 'WA'),
      email:           pick('email', 'Email'),
      lokasi:          pick('lokasi', 'location', 'Lokasi'),
      tanggal:         pick('tanggal', 'date', 'Tanggal', 'tgl'),
      jam_selesai:     pick('jam_selesai', 'jam selesai', 'Jam Selesai', 'jam'),
      paket:           pick('paket', 'package', 'Paket', 'pak'),
      addon:           pick('addon', 'add_on', 'add on', 'Add On', 'tambahan'),
      jumlah_orang:    pick('jumlah_orang', 'jumlah orang', 'Jumlah Orang', 'orang', 'pax'),
      subtotal:        pick('subtotal', 'total', 'Total', 'harga', 'Subtotal'),
      dp:              pick('dp', 'down_payment', 'DP', 'uang_muka'),
      transport_biaya: pick('transport_biaya', 'transport biaya', 'Transport Biaya', 'transport', 'biaya_transport'),
      bukti:           pick('bukti', 'bukti_transfer', 'Bukti Transfer', 'bukti transfer'),
      status:          pick('status', 'Status') || 'pending',
      pelunasan:       pick('pelunasan', 'Pelunasan', 'lunas', 'status_lunas') || 'belum',
      row_index:       raw._rowIndex || raw.rowIndex || null,
      // simpan semua field asli juga, untuk jaga-jaga
      _raw: raw,
    };
  }

  /* ── Load Bookings ── */
  async function loadBookings() {
    const btn = document.getElementById('refreshBtn');
    const spinner = document.getElementById('loadingSpinner');
    const container = document.getElementById('bookingsContainer');

    btn.classList.add('loading');
    btn.disabled = true;
    spinner.style.display = 'block';

    try {
      const response = await fetch(APPS_SCRIPT_URL + '?action=getBookings');
      const data = await response.json();

      if (data.success && data.bookings) {
        allBookings = data.bookings.map(normalizeBooking);
        console.log('[Dashboard] Raw sample:', data.bookings[0]);
        console.log('[Dashboard] Normalized sample:', allBookings[0]);
        populateMonthFilter();
        filterBookings();
      } else {
        container.innerHTML = '<div class="empty-state"><i class="ti ti-alert-circle"></i><p>Gagal memuat data</p></div>';
      }
    } catch (err) {
      console.error('Error loading bookings:', err);
      container.innerHTML = '<div class="empty-state"><i class="ti ti-alert-circle"></i><p>Error: ' + err.message + '</p></div>';
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
      spinner.style.display = 'none';
    }
  }

  /* ── Populate Month Filter ── */
  function populateMonthFilter() {
    const filterMonth = document.getElementById('filterMonth');
    const months = new Set();

    allBookings.forEach(b => {
      if (b.tanggal || b.tanggal === 0) {
        const d = parseDate(b.tanggal);
        if (d) {
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          months.add(year + '-' + month);
        }
      }
    });

    const sortedMonths = Array.from(months).sort().reverse();
    const currentOptions = filterMonth.innerHTML;

    sortedMonths.forEach(monthStr => {
      if (!currentOptions.includes(monthStr)) {
        const [year, month] = monthStr.split('-');
        const date = new Date(year, parseInt(month) - 1);
        const label = date.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
        const option = document.createElement('option');
        option.value = monthStr;
        option.textContent = label;
        filterMonth.appendChild(option);
      }
    });
  }

  /* ── Filter Bookings ── */
  function filterBookings() {
    const monthFilter = document.getElementById('filterMonth').value;
    const statusFilter = document.getElementById('filterStatus').value;

    filteredBookings = allBookings.filter(b => {
      let match = true;

      if (monthFilter) {
        const [year, month] = monthFilter.split('-');
        const bd = parseDate(b.tanggal);
        const bYear = bd ? String(bd.getFullYear()) : '';
        const bMonth = bd ? String(bd.getMonth() + 1).padStart(2, '0') : '';
        match = match && bd && (bYear + '-' + bMonth) === (year + '-' + month);
      }

      if (statusFilter) {
        match = match && (b.status || 'pending') === statusFilter;
      }

      return match;
    });

    // Sort: tanggal terdekat dari sekarang di atas, lalu tanggal mendatang, lalu masa lalu
    const now = new Date();
    now.setHours(0,0,0,0);
    filteredBookings.sort((a, b) => {
      const da = parseDate(a.tanggal);
      const db = parseDate(b.tanggal);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      const diffA = Math.abs(da - now);
      const diffB = Math.abs(db - now);
      return diffA - diffB;
    });

    renderTable();
    updateStats();
  }

  /* ── Render Table ── */
  function renderTable() {
    const container = document.getElementById('bookingsContainer');
    const count = document.getElementById('bookingsCount');

    count.textContent = filteredBookings.length + ' booking';

    if (filteredBookings.length === 0) {
      container.innerHTML = '<div class="empty-state"><i class="ti ti-inbox"></i><p>Tidak ada booking sesuai filter</p></div>';
      return;
    }

    let html = `<table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Tanggal</th>
          <th>Paket</th>
          <th>Total</th>
          <th>DP</th>
          <th>Sisa</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
    `;

    filteredBookings.forEach((booking, idx) => {
      const status = booking.status || 'pending';
      const statusClass = status === 'confirmed' ? 'status-confirmed' : 'status-pending';
      const statusText = status === 'confirmed' ? 'Confirmed' : 'Pending';
      const isLunas = booking.pelunasan === 'lunas';

      const total = parseRp(booking.subtotal);
      const dp = parseRp(booking.dp);
      const sisa = total - dp;

      const enc = encodeURIComponent(JSON.stringify(booking));
      html += `<tr onclick="openModal('${enc}')">
        <td class="name-col">${booking.nama || '-'}</td>
        <td class="date-col">${fmtDate(booking.tanggal)}</td>
        <td class="paket-col">${booking.paket ? booking.paket.split('|')[0].trim() : '-'}</td>
        <td class="price-col">${fmtRp(total)}</td>
        <td>${fmtRp(dp)}</td>
        <td class="price-col ${isLunas ? '' : 'price-col'}" style="${isLunas ? 'color:#2d5a0a' : ''}">${fmtRp(sisa)}</td>
        <td>
          <span class="status-badge ${statusClass}">${statusText}</span>
          <span class="lunas-badge ${isLunas ? 'lunas' : 'belum'}" style="margin-left:4px;">${isLunas ? 'Lunas' : 'Belum Lunas'}</span>
        </td>
        <td><button class="btn-detail" onclick="event.stopPropagation(); openModal('${enc}')">
          <i class="ti ti-eye" style="font-size:12px;"></i> Detail
        </button></td>
      </tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  /* ── Update Stats ── */
  function updateStats() {
    let totalBookings = filteredBookings.length;
    let totalRevenue = 0;
    let totalOrang = 0;
    let totalDpMasuk = 0;
    let totalPelunasan = 0;
    let sisaPelunasan = 0;

    filteredBookings.forEach(b => {
      const total = parseRp(b.subtotal);
      const dp = parseRp(b.dp);
      const sisa = total - dp;
      totalRevenue += dp; // Revenue = DP yang sudah masuk + pelunasan
      totalDpMasuk += dp;
      totalOrang += parseInt(b.jumlah_orang) || 0;

      if (b.pelunasan === 'lunas') {
        totalPelunasan += sisa;
        totalRevenue += sisa;
      } else {
        sisaPelunasan += sisa;
      }
    });

    document.getElementById('totalBookings').textContent = totalBookings;
    document.getElementById('totalRevenue').textContent = fmtRp(totalRevenue);
    document.getElementById('totalDpMasuk').textContent = fmtRp(totalDpMasuk);
    document.getElementById('totalPelunasan').textContent = fmtRp(totalPelunasan);
    document.getElementById('totalOrang').textContent = totalOrang;
    document.getElementById('pendingDP').textContent = fmtRp(sisaPelunasan);
  }

  /* ── Modal ── */
  function openModal(encodedBooking) {

    const modalBody = document.getElementById('modalBody');

    const total = parseRp(booking.subtotal);
    const dp = parseRp(booking.dp);
    const sisa = total - dp;

    const status = booking.status || 'pending';
    const statusClass = status === 'confirmed' ? 'status-confirmed' : 'status-pending';
    const statusText = status === 'confirmed' ? 'Confirmed' : 'Pending';

    let html = `
      <div class="detail-section">
        <div class="detail-section-title">
          <i class="ti ti-user"></i> Informasi Klien
        </div>
        <div class="detail-row">
          <span class="detail-label">Nama</span>
          <span class="detail-value">${booking.nama || '-'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">WhatsApp</span>
          <span class="detail-value"><a href="https://wa.me/${booking.wa}" target="_blank" style="color:var(--pink); text-decoration:none;">${booking.wa || '-'}</a></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Email</span>
          <span class="detail-value">${booking.email || '-'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Lokasi</span>
          <span class="detail-value">${booking.lokasi || '-'}</span>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">
          <i class="ti ti-calendar"></i> Jadwal
        </div>
        <div class="detail-row">
          <span class="detail-label">Tanggal</span>
          <span class="detail-value">${fmtDateTime(booking.tanggal)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Jam Selesai</span>
          <span class="detail-value">${fmtTime(booking.jam_selesai)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Total Orang</span>
          <span class="detail-value">${booking.jumlah_orang || '-'} orang</span>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">
          <i class="ti ti-shopping-cart"></i> Layanan
        </div>
        <div class="detail-row">
          <span class="detail-label">Paket</span>
          <span class="detail-value">${booking.paket || '-'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Add On</span>
          <span class="detail-value">${booking.addon || 'Tidak ada'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Transport</span>
          <span class="detail-value">${booking.transport_biaya || '-'}</span>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">
          <i class="ti ti-cash"></i> Pembayaran
        </div>
        <div class="detail-row">
          <span class="detail-label">Subtotal</span>
          <span class="detail-value highlight">${fmtRp(total)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">DP</span>
          <span class="detail-value">${fmtRp(dp)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Sisa Bayar</span>
          <span class="detail-value highlight">${fmtRp(sisa)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span class="detail-value"><span class="status-badge ${statusClass}">${statusText}</span></span>
        </div>
      </div>
    `;

    if (booking.bukti) {
      html += `
        <div class="detail-section">
          <div class="detail-section-title">
            <i class="ti ti-file"></i> Bukti Transfer
          </div>
          <div class="detail-row">
            <span class="detail-label">File</span>
            <span class="detail-value">${booking.bukti}</span>
          </div>
        </div>
      `;
    }

    const isLunas = booking.pelunasan === 'lunas';
    const status = booking.status || 'pending';

    modalBody.innerHTML = html;

    // Footer aksi
    let footer = document.getElementById('modalFooter');
    if (!footer) {
      footer = document.createElement('div');
      footer.className = 'modal-footer';
      footer.id = 'modalFooter';
      document.querySelector('.modal-content').appendChild(footer);
    }

    const bookingJson = encodeURIComponent(JSON.stringify(booking));
    footer.innerHTML = `
      <button class="btn-status ${status === 'confirmed' ? 'to-pending' : 'to-confirmed'}"
        onclick="toggleStatus('${bookingJson}')">
        <i class="ti ti-${status === 'confirmed' ? 'arrow-back-up' : 'check'}"></i>
        ${status === 'confirmed' ? 'Set Pending' : 'Konfirmasi'}
      </button>
      <button class="btn-status ${isLunas ? 'belum-lunas' : 'lunas'}"
        onclick="togglePelunasan('${bookingJson}')">
        <i class="ti ti-${isLunas ? 'x' : 'cash'}"></i>
        ${isLunas ? 'Batalkan Lunas' : 'Tandai Lunas'}
      </button>
      <button class="btn-status" style="background:var(--pink-light);color:var(--pink);border:0.5px solid rgba(212,83,126,0.3);"
        onclick="openEditModal('${bookingJson}')">
        <i class="ti ti-edit"></i> Edit Data
      </button>
    `;

    document.getElementById('modalOverlay').classList.add('show');
    currentBooking = booking;
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  /* ── Current Booking State ── */
  let currentBooking = null;

  /* ── Toggle Status ── */
  function toggleStatus(encodedBooking) {
    const booking = JSON.parse(decodeURIComponent(encodedBooking));
    const newStatus = (booking.status || 'pending') === 'confirmed' ? 'pending' : 'confirmed';
    const idx = allBookings.findIndex(b => b.timestamp === booking.timestamp && b.nama === booking.nama);
    if (idx !== -1) {
      allBookings[idx].status = newStatus;
      currentBooking = allBookings[idx];
    }
    filterBookings();
    updateStats();
    closeModal();
    // Push ke Sheets
    pushUpdate({ timestamp: booking.timestamp, nama: booking.nama, field: 'status', value: newStatus });
  }

  /* ── Toggle Pelunasan ── */
  function togglePelunasan(encodedBooking) {
    const booking = JSON.parse(decodeURIComponent(encodedBooking));
    const newLunas = booking.pelunasan === 'lunas' ? 'belum' : 'lunas';
    const idx = allBookings.findIndex(b => b.timestamp === booking.timestamp && b.nama === booking.nama);
    if (idx !== -1) {
      allBookings[idx].pelunasan = newLunas;
      currentBooking = allBookings[idx];
    }
    filterBookings();
    updateStats();
    closeModal();
    // Push ke Sheets
    pushUpdate({ timestamp: booking.timestamp, nama: booking.nama, field: 'pelunasan', value: newLunas });
  }

  /* ── Open Edit Modal ── */
  function openEditModal(encodedBooking) {
    const booking = JSON.parse(decodeURIComponent(encodedBooking));
    currentBooking = booking;

    document.getElementById('editNama').value = booking.nama || '';
    document.getElementById('editWa').value = booking.wa || '';
    document.getElementById('editEmail').value = booking.email || '';
    document.getElementById('editLokasi').value = booking.lokasi || '';
    document.getElementById('editStatus').value = booking.status || 'pending';
    document.getElementById('editPelunasan').value = booking.pelunasan || 'belum';

    // Tanggal
    const td = parseDate(booking.tanggal);
    if (td) {
      const y = td.getFullYear();
      const m = String(td.getMonth()+1).padStart(2,'0');
      const d = String(td.getDate()).padStart(2,'0');
      document.getElementById('editTanggal').value = y+'-'+m+'-'+d;
    } else {
      document.getElementById('editTanggal').value = '';
    }

    // Jam
    const jamStr = fmtTime(booking.jam_selesai);
    document.getElementById('editJam').value = jamStr !== '-' ? jamStr : '';

    document.getElementById('editSaveStatus').textContent = '';
    document.getElementById('editOverlay').classList.add('show');
  }

  function closeEditModal() {
    document.getElementById('editOverlay').classList.remove('show');
  }

  /* ── Save Edit ── */
  async function saveEdit() {
    if (!currentBooking) return;
    const statusEl = document.getElementById('editSaveStatus');
    statusEl.textContent = 'Menyimpan...';
    statusEl.className = 'save-status';

    const updated = {
      ...currentBooking,
      nama:      document.getElementById('editNama').value.trim(),
      wa:        document.getElementById('editWa').value.trim(),
      email:     document.getElementById('editEmail').value.trim(),
      lokasi:    document.getElementById('editLokasi').value.trim(),
      tanggal:   document.getElementById('editTanggal').value,
      jam_selesai: document.getElementById('editJam').value,
      status:    document.getElementById('editStatus').value,
      pelunasan: document.getElementById('editPelunasan').value,
    };

    // Update di memori lokal
    const idx = allBookings.findIndex(b => b.timestamp === currentBooking.timestamp && b._raw && JSON.stringify(b._raw) === JSON.stringify(currentBooking._raw));
    if (idx !== -1) allBookings[idx] = updated;
    currentBooking = updated;

    filterBookings();
    updateStats();

    // Push semua field yang berubah ke Sheets
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'updateBooking',
          timestamp: updated.timestamp,
          namaAsli: currentBooking.nama,
          fields: {
            nama: updated.nama,
            wa: updated.wa,
            email: updated.email,
            lokasi: updated.lokasi,
            tanggal: updated.tanggal,
            jam_selesai: updated.jam_selesai,
            status: updated.status,
            pelunasan: updated.pelunasan,
          }
        })
      });
      const data = await res.json();
      if (data.success) {
        statusEl.textContent = '✓ Tersimpan';
        statusEl.className = 'save-status ok';
        setTimeout(closeEditModal, 1200);
      } else {
        statusEl.textContent = '✗ ' + (data.error || 'Gagal simpan');
        statusEl.className = 'save-status err';
      }
    } catch (e) {
      statusEl.textContent = '✗ Koneksi gagal';
      statusEl.className = 'save-status err';
    }
  }

  /* ── Push Update ke Sheets (untuk toggle status/pelunasan) ── */
  async function pushUpdate(payload) {
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'updateField', ...payload })
      });
    } catch(e) {
      console.warn('pushUpdate failed:', e);
    }
  }

  /* ── Close modal stops event propagation ── */
  document.getElementById('modalOverlay').addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeEditModal(); } });

  /* ── Init ── */
  window.addEventListener('DOMContentLoaded', () => {
    loadBookings();
  });
</script>
